name: ci

# lab-management-system-aspnetcore (ASP.NET Core 8 backend)
# 推送链（与 saas-identity-platform-aspnetcore 同款, docker build & push + VPS 部署）:
# - branch push(master/main) → 只跑 test（对齐门禁 L1-L4）
# - tag push(v<X>.<Y>.<Z>-<YYYYMMDD> per tag.md §1) → test + docker build & push + VPS 部署
# 镜像名/SSH 路径/部署脚本用 ${{ github.event.repository.name }} 避免跨仓劫持。
# 与 saas-aspnetcore 的差异: env 转发多一个 JWT_SIGNING_KEY（HS256 签 lab JWT,
# deploy 脚本自举 aspnetcore.env 时必填, 缺则 fail-fast）。
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: L1 format
        run: dotnet format src/Lab.AspNetCore.csproj --verify-no-changes --include src/**
      - name: L2+L3 build (warnings as errors)
        run: dotnet build tests/Lab.AspNetCore.Tests.csproj /p:TreatWarningsAsErrors=true
      - name: L4 test
        run: dotnet test tests/Lab.AspNetCore.Tests.csproj

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    concurrency:
      group: deploy-${{ github.event.repository.name }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}:${{ github.ref_name }}

      - name: Pull image and restart container on VPS
        uses: appleboy/ssh-action@v1
        # appleboy/ssh-action@v1 的 ${{ secrets.* }} 不会自动进 SSH 远端 shell;
        # step env 注入 Actions env,with.envs 列出要转发的名字 (逗号分隔)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SIGNING_KEY: ${{ secrets.JWT_SIGNING_KEY }}
          LAB_SAAS_CLIENT_SECRET: ${{ secrets.LAB_SAAS_CLIENT_SECRET }}
          LAB_SAAS_DEFAULT_TENANT_ID: ${{ secrets.LAB_SAAS_DEFAULT_TENANT_ID }}
          NGINX_DOMAIN: ${{ vars.NGINX_DOMAIN }}
          NGINX_CERT_BASENAME: ${{ vars.NGINX_CERT_BASENAME }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: DATABASE_URL,JWT_SIGNING_KEY,LAB_SAAS_CLIENT_SECRET,LAB_SAAS_DEFAULT_TENANT_ID,NGINX_DOMAIN,NGINX_CERT_BASENAME
          script: |
            # 自举: 首次部署无 /home/deploy/<repo>/ 时自动建 + 总是重拉 deploy 脚本
            # （避免 v0.x.y 修了 deploy 脚本但 VPS 还跑着旧版的坑）
            set -e
            REPO="${{ github.event.repository.name }}"
            DEPLOY_DIR="/home/deploy/$REPO"
            mkdir -p "$DEPLOY_DIR"
            cd "$DEPLOY_DIR"
            curl -fsSL "https://raw.githubusercontent.com/zcqiand/${REPO}/refs/heads/master/deploy/${REPO}.sh" -o "$REPO.sh"
            chmod +x "$REPO.sh"
            # aspnetcore 额外拉 nginx-vps.conf.example（deploy 脚本自举 nginx vhost 用）
            if [ ! -f "nginx-vps.conf.example" ] && [ ! -d deploy ]; then
              curl -fsSL "https://raw.githubusercontent.com/zcqiand/${REPO}/refs/heads/master/deploy/nginx-vps.conf.example" -o "nginx-vps.conf.example" || true
            fi
            # 缺 aspnetcore.env 时, deploy 脚本会从 SSH env 透传过来的
            # DATABASE_URL + JWT_SIGNING_KEY + LAB_SAAS_CLIENT_SECRET 自举 (UMASK 077, chmod 600).
            # DATABASE_USER/PASSWORD 不转发: 连接串已内嵌凭据（2026-08-28 删冗余 secrets）。
            # 后续 deploy 不需要这些 env (env-file 已存在).
            echo "→ env on remote: DATABASE_URL_set=$([ -n \"${DATABASE_URL:-}\" ] && echo yes || echo no) LAB_SAAS_CLIENT_SECRET_set=$([ -n \"${LAB_SAAS_CLIENT_SECRET:-}\" ] && echo yes || echo no)"
            if [ ! -f "aspnetcore.env" ]; then
              if [ -n "$DATABASE_URL" ] && [ -n "$JWT_SIGNING_KEY" ] && [ -n "$LAB_SAAS_CLIENT_SECRET" ]; then
                echo "→ aspnetcore.env will be bootstrapped by deploy script from SSH env (含 SSO 4 字段)"
              else
                echo "ERROR: aspnetcore.env missing AND DATABASE_URL/JWT_SIGNING_KEY/LAB_SAAS_CLIENT_SECRET secrets not forwarded, deploy script will fail-fast" >&2
              fi
            fi
            sh "$REPO.sh" "${{ secrets.DOCKER_USERNAME }}" "${{ secrets.DOCKER_PASSWORD }}" "${{ github.ref_name }}"